<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost the Scent | PawsHaven</title>
  
  <link rel="icon" type="image/png" href="images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800;900&family=Quicksand:wght@600;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">

  <!-- Prevent Theme & Layout Flicker (Anti-FOUC) -->
  <script>
    (function() {
      const t = localStorage.getItem('paws_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'dark') document.documentElement.classList.add('dark');
      const d = localStorage.getItem('paws_dir') || 'ltr';
      document.documentElement.setAttribute('dir', d);
      if (d === 'rtl') document.documentElement.classList.add('rtl');

      document.documentElement.classList.add('paws-loading');
      function reveal() {
        document.documentElement.classList.remove('paws-loading');
      }
      if (document.readyState === 'complete') {
        reveal();
      } else {
        window.addEventListener('DOMContentLoaded', reveal);
        setTimeout(reveal, 250);
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#1B4D3E',
              sage: '#2D6A4F',
              coral: '#E07A5F',
              amber: '#F4A261',
              ivory: '#FAF8F5',
              sand: '#F4EFEA',
              charcoal: '#2C3E35'
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-theme-base text-theme-main antialiased selection:bg-[#E07A5F] selection:text-white min-h-screen flex flex-col justify-between">

  <!-- 404 Hero -->
  <section class="pt-8 sm:pt-12 pb-16 flex-1 flex items-center justify-center px-4 text-center">
    <div class="max-w-lg mx-auto space-y-6">
      
      <div class="relative w-48 h-48 mx-auto rounded-full overflow-hidden border-4 border-white dark:border-white/10 shadow-2xl">
        <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=400&q=80" alt="Curious dog head tilt" class="w-full h-full object-cover">

          Looks like that tennis ball bounced out of the yard. The page you are looking for has been moved or buried in the meadow.
        </p>
      </div>

      <!-- Quick Actions -->
      <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
        <a href="index.html" class="btn-brand-accent py-3 px-6 rounded-xl text-xs font-bold shadow-md">
          <i class="bi bi-house-heart-fill"></i> Back to Homepage
        </a>
        <a href="services.html" class="btn-brand-outline py-3 px-6 rounded-xl text-xs font-bold">
          Explore Services
        </a>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <div id="paws-footer"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

  <script src="js/footer.js"></script>
</body>
</html>
