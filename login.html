<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Sign In - PawsHaven</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect') || '';
      let target = 'index.html?auth=login';
      if (redirect) {
        target += '&redirect=' + encodeURIComponent(redirect);
      }
      window.location.replace(target);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800;900&family=Quicksand:wght@600;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d1a15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #faf8f5;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #e07a5f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div style="text-align: center;">
    <div class="spinner"></div>
    <p style="font-size: 14px; font-weight: 600; color: #a1b0a8;">Opening Sign In Modal...</p>
  </div>
</body>
</html>
